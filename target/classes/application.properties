spring.application.name=whistledrop
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whistledrop}
spring.datasource.username=${DB_USERNAME:whistledrop}
spring.datasource.password=${DB_PASSWORD:whistledrop}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
whistledrop.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-bytes}
whistledrop.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
whistledrop.moderator.username=${MODERATOR_USERNAME:moderator}
whistledrop.moderator.password=${MODERATOR_PASSWORD:change-me-now}
springdoc.swagger-ui.path=/swagger-ui.html
